name: Android

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  build-android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Release build signed with the template's debug key: fine for testing, NOT for the Play Store.
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - run: mv android/app/build/outputs/apk/release/app-release.apk warranty-keeper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: warranty-keeper.apk
          if-no-files-found: error

  screenshots:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/ci-screenshots.sh warranty-keeper.apk screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      # main -> android-screenshots, other branches -> android-screenshots-<branch with / replaced by ->
      - name: Publish screenshots to a branch
        if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          TARGET=android-screenshots
          if [ "$GITHUB_REF_NAME" != main ]; then TARGET="android-screenshots-${GITHUB_REF_NAME//\//-}"; fi
          cd screenshots
          git init -q -b "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Android emulator screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$TARGET"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: warranty-keeper.apk
          body: |
            Test build signed with a debug key (not for the Play Store).
            Build de test signé avec une clé de débogage (pas pour le Play Store).
